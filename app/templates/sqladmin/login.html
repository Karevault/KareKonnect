{% extends "sqladmin/base.html" %}
{% block head %}
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --danger: #b91c1c;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .hc-login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .hc-login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      padding: 2rem 1.75rem 1.75rem;
    }
    .hc-brand {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .hc-brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .hc-brand p {
      margin: 0.35rem 0 0;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .hc-login-card .form-label {
      color: var(--muted);
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }
    .hc-login-card .form-control {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }
    .hc-login-card .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
      outline: none;
    }
    .hc-login-card .form-control::placeholder {
      color: #94a3b8;
    }
    .hc-login-card .btn-primary {
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.65rem 1rem;
    }
    .hc-login-card .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    .hc-login-card .invalid-feedback {
      color: var(--danger);
      font-size: 0.8125rem;
    }
  </style>
{% endblock %}
{% block body %}
<div class="hc-login-wrap">
  <form class="hc-login-card" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="hc-brand">
      <h1>Kareconnect</h1>
      <p>Administrator sign-in</p>
    </div>
    <div class="mb-3">
      <label class="form-label" for="hc-user">Username</label>
      {% if error %}
      <input id="hc-user" name="username" type="text" class="form-control is-invalid" placeholder="Username" autocomplete="username">
      <div class="invalid-feedback d-block">{{ error }}</div>
      {% else %}
      <input id="hc-user" name="username" type="text" class="form-control" placeholder="Username" autocomplete="username">
      {% endif %}
    </div>
    <div class="mb-3">
      <label class="form-label" for="hc-pass">Password</label>
      {% if error %}
      <input id="hc-pass" name="password" type="password" class="form-control is-invalid" placeholder="Password" autocomplete="current-password">
      {% else %}
      <input id="hc-pass" name="password" type="password" class="form-control" placeholder="Password" autocomplete="current-password">
      {% endif %}
    </div>
    <div class="d-grid mt-4">
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </div>
  </form>
</div>
{% endblock %}
